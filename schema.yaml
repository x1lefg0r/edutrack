  /api/olympiads/{slug}/unpublish/:
    post:
      operationId: olympiads_unpublish_create
      description: |-
        update() — обновляет записи на уровне SQL без загрузки объектов.
        Эффективнее чем obj.save() когда нужно обновить много записей
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - olympiads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OlympiadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OlympiadRequest'
          multipart/form-data:

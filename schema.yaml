  /api/olympiads/{slug}/unregister/:
    delete:
      operationId: olympiads_unregister_destroy
      description: |-
        delete() — удаляет записи на уровне SQL
        __contains — регистрозависимый поиск (в отличие от icontains)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - olympiads
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/olympiads/subjects_list/:

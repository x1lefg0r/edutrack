components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        description:
          type: string
          title: Описание
        icon:
          type: string
          format: uri
          nullable: true
          title: Иконка
        trigger:
          allOf:
          - $ref: '#/components/schemas/TriggerEnum'
          title: Триггер
        threshold:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Порог
          description: Например, 7 для стрика в 7 дней
      required:
      - description
      - id
      - threshold
      - title
      - trigger
    ActivityDay:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        subject:
          type: integer
          title: Предмет
        subject_name:
          type: string
          readOnly: true
        olympiad:
          type: integer
          nullable: true
          title: Готовит к олимпиаде
        olympiad_title:
          type: string
          readOnly: true
        description:
          type: string
          title: Описание
        format:
          allOf:
          - $ref: '#/components/schemas/CourseFormatEnum'
